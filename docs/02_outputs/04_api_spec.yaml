          description: Primary cover image of the product
        categories:
          type: array
          description: Categories this product belongs to
          items:
            $ref: "#/components/schemas/Category"
        is_active:
          type: boolean
          description: Whether the product is publicly visible
      required:
        - id
        - name
        - slug
        - price
        - discount_percent
        - discounted_price
        - attributes
        - categories
        - is_active
      example:
        id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
        name: "Mandala Colouring Journal A5"
        slug: "mandala-colouring-journal-a5"
        price: 499.00
        discount_percent: 10.0
        discounted_price: 449.10
        attributes:
          - attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"
            attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
            code: "level"
            attribute_name: "Skill Level"
            value: "Beginner"
            value_slug: "beginner"
            is_filterable: true
          - attribute_value_id: "dc0e8400-e29b-41d4-a716-446655440022"
            attribute_id: "dd0e8400-e29b-41d4-a716-446655440023"
            code: "theme"
            attribute_name: "Theme"
            value: "Mandala"
            value_slug: "mandala"
            is_filterable: true
        cover_image:
          id: "f1e2d3c4-b5a6-7890-1234-56789abcdef0"
          url: "https://cdn.example.com/products/mandala-journal-thumb.jpg"
          alt_text: "Mandala Colouring Journal A5"
          sort_order: 1
        categories:
          - id: "c1a2b3d4-e5f6-7890-ab12-cd34ef567890"
            name: "Journals"
            slug: "journals"
            description: null
            image_url: null
            created_at: "2026-01-01T00:00:00Z"
            updated_at: "2026-01-01T00:00:00Z"
        is_active: true

    ProductFilters:
      type: object
      description: Available filter option values derived from the current product catalog
      properties:
        categories:
          type: array
          description: Available category slugs
          items:
            type: string
            description: Category slug
        attributes:
          type: array
          description: Available attribute filter groups (one entry per attribute key present in the result set)
          items:
            $ref: "#/components/schemas/AttributeFilterGroup"
        sort_options:
          type: array
          description: Supported sort_by values
          items:
            type: string
            enum: [price_asc, price_desc, newest, popular]
            description: Sort option identifier
      required: [categories, attributes, sort_options]
      example:
        categories: ["journals", "sketch-pads", "colouring-books"]
        attributes:
          - attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
            code: "level"
            attribute_name: "Skill Level"
            is_filterable: true
            values:
              - id: "db0e8400-e29b-41d4-a716-446655440021"
                value_slug: "beginner"
                value: "Beginner"
              - id: "dc0e8400-e29b-41d4-a716-446655440022"
                value_slug: "intermediate"
                value: "Intermediate"
          - attribute_id: "dd0e8400-e29b-41d4-a716-446655440023"
            code: "theme"
            attribute_name: "Theme"
            is_filterable: true
            values:
              - id: "de0e8400-e29b-41d4-a716-446655440024"
                value_slug: "mandala"
                value: "Mandala"
              - id: "df0e8400-e29b-41d4-a716-446655440025"
                value_slug: "floral"
                value: "Floral"
        sort_options: ["price_asc", "price_desc", "newest", "popular"]

    ProductListResponse:
      type: object
      description: Paginated product list response including available filters
      properties:
        data:
          type: array
          description: Array of abbreviated product summaries
          items:
            $ref: "#/components/schemas/ProductSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
        filters:
          $ref: "#/components/schemas/ProductFilters"
      required: [data, meta, filters]
      example:
        data:
          - id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
            name: "Mandala Colouring Journal A5"
            slug: "mandala-colouring-journal-a5"
            price: 499.00
            discount_percent: 10.0
            discounted_price: 449.10
            attributes:
              - attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"
                attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
                code: "level"
                attribute_name: "Skill Level"
                value: "Beginner"
                value_slug: "beginner"
                is_filterable: true
            cover_image: null
            categories: []
            is_active: true
        meta:
          total: 87
          page: 1
          limit: 20
          total_pages: 5
        filters:
          categories: ["journals", "sketch-pads"]
          attributes:
            - attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
              code: "level"
              attribute_name: "Skill Level"
              is_filterable: true
              values:
                - id: "db0e8400-e29b-41d4-a716-446655440021"
                  value_slug: "beginner"
                  value: "Beginner"
                - id: "dc0e8400-e29b-41d4-a716-446655440022"
                  value_slug: "intermediate"
                  value: "Intermediate"
          sort_options: ["price_asc", "price_desc", "newest", "popular"]

    CreateProductRequest:
      type: object
      description: |
        Request body to create a new product.
        Attributes (level, theme, size, etc.) are managed separately via
        POST /api/v1/admin/products/{id}/attributes after creation.
        Images must be uploaded first via POST /api/v1/admin/upload/image/presign;
        use the returned `public_url` values in the `image_urls` array.
      properties:
        name:
          type: string
          description: Display name of the product
        slug:
          type: string
          description: URL-safe unique identifier; must be unique across all products
        description:
          type: string
          description: Full product description
        price:
          type: number
          format: float
          minimum: 0
          description: Base price in INR
        discount_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Discount percentage (0 means no discount)
        stock:
          type: integer
          minimum: 0
          description: Initial stock quantity
        category_ids:
          type: array
          description: UUIDs of categories to associate with the product
          items:
            type: string
            format: uuid
            description: Category UUID
        image_urls:
          type: array
          description: Ordered list of image objects to attach
          items:
            type: object
            description: Image data for a new product image
            properties:
              url:
                type: string
                format: uri
                description: Full URL of the image
              alt_text:
                type: ["string", "null"]
                description: Alt text or null
              sort_order:
                type: integer
                description: Display order index
            required: [url, sort_order]
        is_active:
          type: boolean
          description: Whether the product should be publicly visible immediately
      required: [name, slug, description, price, discount_percent, stock, is_active]
      example:
        name: "Mandala Colouring Journal A5"
        slug: "mandala-colouring-journal-a5"
        description: "A beautifully crafted A5 journal with 120 mandala colouring pages."
        price: 499.00
        discount_percent: 10.0
        stock: 150
        category_ids: ["c1a2b3d4-e5f6-7890-ab12-cd34ef567890"]
        image_urls:
          - url: "https://cdn.example.com/products/mandala-journal-front.jpg"
            alt_text: "Front cover"
            sort_order: 1
        is_active: true

    ImagePresignRequest:
      type: object
      description: Request body to obtain a presigned S3 URL for a product image upload.
      properties:
        filename:
          type: string
          description: Original filename including extension (e.g. front-cover.jpg)
          example: "mandala-journal-front.jpg"
        content_type:
          type: string
          description: MIME type of the image being uploaded
          enum: [image/jpeg, image/png, image/webp]
          example: "image/jpeg"
        file_size_bytes:
          type: integer
          description: Size of the file in bytes; must not exceed 5 242 880 (5 MB)
          minimum: 1
          maximum: 5242880
          example: 204800
      required: [filename, content_type, file_size_bytes]

    ImagePresignResponse:
      type: object
      description: |
        Presigned S3 upload URL and the final public CDN URL.
        Use `presigned_url` to PUT the image directly from the client to S3.
        Use `public_url` in `image_urls[].url` when creating or updating a product.
      properties:
        presigned_url:
          type: string
          format: uri
          description: Short-lived presigned S3 PUT URL; expires at `expires_at`
          example: "https://media-bucket.s3.ap-south-1.amazonaws.com/products/uuid.jpg?X-Amz-Signature=..."
        public_url:
          type: string
          format: uri
          description: Final CDN URL the image will be accessible at after a successful upload
          example: "https://media.cdn.example.com/products/uuid.jpg"
        expires_at:
          type: string
          format: date-time
          description: UTC timestamp when the presigned URL expires (5 minutes from issuance)
          example: "2026-03-30T12:05:00Z"
      required: [presigned_url, public_url, expires_at]

    UpdateProductRequest:
      type: object
      description: |
        Request body to update a product; all fields are optional.
        Attributes (level, theme, size, etc.) are managed separately via
        PUT /api/v1/admin/products/{id}/attributes/{attrId}.
      properties:
        name:
          type: string
          description: Updated display name
        slug:
          type: string
          description: Updated URL-safe slug
        description:
          type: string
          description: Updated product description
        price:
          type: number
          format: float
          minimum: 0
          description: Updated base price in INR
        discount_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Updated discount percentage
        stock:
          type: integer
          minimum: 0
          description: Updated stock quantity
        category_ids:
          type: array
          description: Replace associated categories with this list of UUIDs
          items:
            type: string
            format: uuid
            description: Category UUID
        image_urls:
          type: array
          description: Replace product images with this ordered list
          items:
            type: object
            description: Image data for a product image
            properties:
              url:
                type: string
                format: uri
                description: Full URL of the image
              alt_text:
                type: ["string", "null"]
                description: Alt text or null
              sort_order:
                type: integer
                description: Display order index
            required: [url, sort_order]
        is_active:
          type: boolean
          description: Updated visibility flag
      example:
        price: 449.00
        discount_percent: 0.0
        stock: 200
        is_active: true

    # ------------------------------------------------------------------
    # Product Attributes
    # ------------------------------------------------------------------

    ProductAttribute:
      type: object
      description: |
        Denormalized view of a PRODUCT_ATTRIBUTE_ASSIGNMENTS row.
        Returned when listing or reading product attributes. Joins across
        PRODUCT_ATTRIBUTES (dimension definition) and PRODUCT_ATTRIBUTE_VALUES (allowed value).
      required: [attribute_value_id, attribute_id, code, attribute_name, value, value_slug]
      properties:
        attribute_value_id:
          type: string
          format: uuid
          description: UUID of the assigned PRODUCT_ATTRIBUTE_VALUES row; used as the identifier in DELETE assignment requests
          example: "db0e8400-e29b-41d4-a716-446655440021"
        attribute_id:
          type: string
          format: uuid
          description: UUID of the PRODUCT_ATTRIBUTES definition row
          example: "da0e8400-e29b-41d4-a716-446655440020"
        code:
          type: string
          description: Machine-readable attribute dimension code from PRODUCT_ATTRIBUTES.code (e.g. level, theme, size)
          example: "level"
        attribute_name:
          type: string
          description: Display name of the attribute dimension from PRODUCT_ATTRIBUTES.name
          example: "Skill Level"
        value:
          type: string
          description: Human-readable attribute value from PRODUCT_ATTRIBUTE_VALUES.value
          example: "Beginner"
        value_slug:
          type: string
          description: URL-safe slug from PRODUCT_ATTRIBUTE_VALUES.slug; used as the filter query param value
          example: "beginner"
        is_filterable:
          type: boolean
          description: Whether this attribute dimension is exposed as a product list filter
          example: true
      example:
        attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"
        attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
        code: "level"
        attribute_name: "Skill Level"
        value: "Beginner"
        value_slug: "beginner"
        is_filterable: true

    AssignProductAttributeRequest:
      type: object
      description: |
        Assign a pre-defined attribute value to a product (creates a PRODUCT_ATTRIBUTE_ASSIGNMENTS row).
        The value must already exist in PRODUCT_ATTRIBUTE_VALUES. Use the admin-attributes endpoints
        to create dimensions and values before assigning them to products.
      required: [attribute_value_id]
      properties:
        attribute_value_id:
          type: string
          format: uuid
          description: UUID of the PRODUCT_ATTRIBUTE_VALUES row to assign to this product
          example: "db0e8400-e29b-41d4-a716-446655440021"
      example:
        attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"

    AttributeDefinition:
      type: object
      description: |
        An attribute dimension definition (PRODUCT_ATTRIBUTES table).
        Represents a filterable dimension such as level, theme, or size.
        Each definition has a set of allowed values in PRODUCT_ATTRIBUTE_VALUES.
      required: [id, code, name, is_filterable, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Attribute definition UUID
          example: "da0e8400-e29b-41d4-a716-446655440020"
        code:
          type: string
          description: Machine-readable unique code (e.g. level, theme, size); used as the URL query param name for filtering
          example: "level"
        name:
          type: string
          description: Human-readable display name
          example: "Skill Level"
        is_filterable:
          type: boolean
          description: Whether this dimension is exposed as a filter on the product list page
          example: true
        sort_order:
          type: integer
          description: Display order in filter UI (ascending)
          example: 1
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2026-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-01-10T00:00:00Z"
      example:
        id: "da0e8400-e29b-41d4-a716-446655440020"
        code: "level"
        name: "Skill Level"
        is_filterable: true
        sort_order: 1
        created_at: "2026-01-01T00:00:00Z"
        updated_at: "2026-01-10T00:00:00Z"

    AttributeDefinitionValue:
      type: object
      description: A single allowed value for an attribute dimension (PRODUCT_ATTRIBUTE_VALUES table)
      required: [id, attribute_id, value, value_slug, sort_order, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Value UUID; used as attribute_value_id when assigning to products
          example: "db0e8400-e29b-41d4-a716-446655440021"
        attribute_id:
          type: string
          format: uuid
          description: Parent attribute definition UUID
          example: "da0e8400-e29b-41d4-a716-446655440020"
        value:
          type: string
          description: Human-readable value label
          example: "Beginner"
        value_slug:
          type: string
          description: URL-safe slug used in filter query params
          example: "beginner"
        sort_order:
          type: integer
          description: Display order within this dimension (ascending)
          example: 1
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
          example: "2026-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-01-10T00:00:00Z"
      example:
        id: "db0e8400-e29b-41d4-a716-446655440021"
        attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
        value: "Beginner"
        value_slug: "beginner"
        sort_order: 1
        created_at: "2026-01-01T00:00:00Z"
        updated_at: "2026-01-10T00:00:00Z"

    CreateAttributeDefinitionRequest:
      type: object
      description: Create a new product attribute dimension
      required: [code, name]
      properties:
        code:
          type: string
          description: Machine-readable unique code (lowercase, no spaces)
          example: "level"
        name:
          type: string
          description: Human-readable display name
          example: "Skill Level"
        is_filterable:
          type: boolean
          description: Expose as a filter on the product list page (default true)
          example: true
        sort_order:
          type: integer
          description: Display order in the filter UI
          example: 1
      example:
        code: "level"
        name: "Skill Level"
        is_filterable: true
        sort_order: 1

    UpdateAttributeDefinitionRequest:
      type: object
      description: Update an attribute dimension; all fields optional
      properties:
        name:
          type: string
          description: Updated display name
          example: "Skill Level"
        is_filterable:
          type: boolean
          description: Updated filterable flag
          example: false
        sort_order:
          type: integer
          description: Updated display order
          example: 2
      example:
        is_filterable: false

    CreateAttributeDefinitionValueRequest:
      type: object
      description: Add an allowed value to an attribute dimension
      required: [value]
      properties:
        value:
          type: string
          description: Human-readable value label
          example: "Intermediate"
        value_slug:
          type: string
          description: URL-safe slug (auto-generated from value if omitted)
          example: "intermediate"
        sort_order:
          type: integer
          description: Display order within this dimension
          example: 2
      example:
        value: "Intermediate"
        sort_order: 2

    UpdateAttributeDefinitionValueRequest:
      type: object
      description: Update an attribute value; all fields optional
      properties:
        value:
          type: string
          description: Updated human-readable label
          example: "Intermediate"
        value_slug:
          type: string
          description: Updated URL slug
          example: "intermediate"
        sort_order:
          type: integer
          description: Updated sort order
          example: 2
      example:
        sort_order: 3

    AttributeFilterGroup:
      type: object
      description: |
        All distinct values available for a single filterable attribute dimension
        within the current product result set. Enriched with the full attribute definition.
      required: [attribute_id, code, attribute_name, is_filterable, values]
      properties:
        attribute_id:
          type: string
          format: uuid
          description: Attribute definition UUID
          example: "da0e8400-e29b-41d4-a716-446655440020"
        code:
          type: string
          description: Machine-readable attribute dimension code (e.g. level, theme, size)
          example: "level"
        attribute_name:
          type: string
          description: Display name of the attribute dimension
          example: "Skill Level"
        is_filterable:
          type: boolean
          description: Whether this dimension is shown as a filter in the UI
          example: true
        values:
          type: array
          description: Distinct attribute values present in the result set for this dimension
          items:
            type: object
            description: A single available filter value
            required: [id, value_slug, value]
            properties:
              id:
                type: string
                format: uuid
                description: attribute_value_id (PRODUCT_ATTRIBUTE_VALUES.id) — send this as attr_value_id[] to filter by this value
                example: "db0e8400-e29b-41d4-a716-446655440021"
              value_slug:
                type: string
                description: URL-safe slug (retained for display and category page routing)
                example: "beginner"
              value:
                type: string
                description: Human-readable display label
                example: "Beginner"
      example:
        attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
        code: "level"
        attribute_name: "Skill Level"
        is_filterable: true
        values:
          - id: "db0e8400-e29b-41d4-a716-446655440021"
            value_slug: "beginner"
            value: "Beginner"
          - id: "dc0e8400-e29b-41d4-a716-446655440022"
            value_slug: "intermediate"
            value: "Intermediate"

    AttributeWithValues:
      type: object
      description: |
        A filterable attribute definition together with its complete list of allowed values.
        Used by `GET /api/v1/attributes` to let the frontend pre-populate filter UI
        (level, size, theme, etc.) independently of any product query.
      required: [id, code, name, is_filterable, sort_order, values]
      properties:
        id:
          type: string
          format: uuid
          description: Attribute definition UUID
          example: "da0e8400-e29b-41d4-a716-446655440020"
        code:
          type: string
          description: Machine-readable unique code used as the filter query param name (e.g. level, theme, size)
          example: "level"
        name:
          type: string
          description: Human-readable display name shown in filter UI
          example: "Skill Level"
        is_filterable:
          type: boolean
          description: Always true for objects returned from the public attributes endpoint
          example: true
        sort_order:
          type: integer
          description: Display order in filter UI (ascending)
          example: 1
        values:
          type: array
          description: Complete list of allowed values for this attribute dimension, ordered by sort_order
          items:
            $ref: "#/components/schemas/AttributeDefinitionValue"
      example:
        id: "da0e8400-e29b-41d4-a716-446655440020"
        code: "level"
        name: "Skill Level"
        is_filterable: true
        sort_order: 1
        values:
          - id: "db0e8400-e29b-41d4-a716-446655440021"
            attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
            value: "Beginner"
            value_slug: "beginner"
            sort_order: 1
            created_at: "2026-01-01T00:00:00Z"
            updated_at: "2026-01-10T00:00:00Z"
          - id: "dc0e8400-e29b-41d4-a716-446655440022"
            attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
            value: "Intermediate"
            value_slug: "intermediate"
            sort_order: 2
            created_at: "2026-01-01T00:00:00Z"
            updated_at: "2026-01-10T00:00:00Z"

    # ------------------------------------------------------------------
    # Cart
    # ------------------------------------------------------------------

    CartItem:
      type: object
      description: A single line item in the shopping cart
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the cart item
        product:
          $ref: "#/components/schemas/ProductSummary"
        quantity:
          type: integer
          minimum: 1
          description: Number of units of this product in the cart
        unit_price:
          type: number
          format: float
          description: Price per unit at the time the item was added (INR)
        line_total:
          type: number
          format: float
          description: unit_price multiplied by quantity (INR)
      required: [id, product, quantity, unit_price, line_total]
      example:
        id: "7b4e2a11-9c83-4f6d-a512-1d8e3b7c0a55"
        product:
          id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
          name: "Mandala Colouring Journal A5"
          slug: "mandala-colouring-journal-a5"
          price: 499.00
          discount_percent: 10.0
          discounted_price: 449.10
          attributes:
            - attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"
              attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
              code: "level"
              attribute_name: "Skill Level"
              value: "Beginner"
              value_slug: "beginner"
              is_filterable: true
          cover_image: null
          categories: []
          is_active: true
        quantity: 2
        unit_price: 449.10
        line_total: 898.20

    Cart:
      type: object
      description: The customer's shopping cart
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the cart
        items:
          type: array
          description: List of cart line items
          items:
            $ref: "#/components/schemas/CartItem"
        item_count:
          type: integer
          description: Total number of unique product lines in the cart
        subtotal:
          type: number
          format: float
          description: Sum of all line_total values before any discounts or tax (INR)
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the cart was last modified
      required: [id, items, item_count, subtotal, updated_at]
      example:
        id: "d4e5f6a7-b8c9-0123-de45-f6789abcdef0"
        items:
          - id: "7b4e2a11-9c83-4f6d-a512-1d8e3b7c0a55"
            product:
              id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
              name: "Mandala Colouring Journal A5"
              slug: "mandala-colouring-journal-a5"
              price: 499.00
              discount_percent: 10.0
              discounted_price: 449.10
              level: "beginner"
              theme: "mandala"
              size: "A5"
              cover_image: null
              categories: []
              is_active: true
            quantity: 2
            unit_price: 449.10
            line_total: 898.20
        item_count: 1
        subtotal: 898.20
        updated_at: "2026-03-20T15:30:00Z"

    AddToCartRequest:
      type: object
      description: Request body to add a product to the cart
      properties:
        product_id:
          type: string
          format: uuid
          description: UUID of the product to add
        quantity:
          type: integer
          minimum: 1
          description: Number of units to add
      required: [product_id, quantity]
      example:
        product_id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
        quantity: 2

    UpdateCartItemRequest:
      type: object
      description: Request body to update the quantity of a cart item
      properties:
        quantity:
          type: integer
          minimum: 1
          description: New quantity; set to 0 is not allowed — use DELETE to remove
      required: [quantity]
      example:
        quantity: 3

    # ------------------------------------------------------------------
    # Checkout
    # ------------------------------------------------------------------

    ApplyCouponRequest:
      type: object
      description: Request body containing a coupon code to apply or validate
      properties:
        coupon_code:
          type: string
          description: The coupon code string to validate
      required: [coupon_code]
      example:
        coupon_code: "SAVE50"

    CouponValidationResponse:
      type: object
      description: Result of validating a coupon code
      properties:
        is_valid:
          type: boolean
          description: Whether the coupon code is valid and can be applied
        coupon_code:
          type: string
          description: The coupon code that was validated
        discount_type:
          type: ["string", "null"]
          enum: [flat, percentage, null]
          description: Type of discount — flat (fixed INR off) or percentage (% off) or null if invalid
        discount_value:
          type: ["number", "null"]
          format: float
          description: Discount value; INR amount for flat, percentage for percentage type, or null
        message:
          type: string
          description: Human-readable message about the coupon validity
      required: [is_valid, coupon_code, message]
      example:
        is_valid: true
        coupon_code: "SAVE50"
        discount_type: "flat"
        discount_value: 50.00
        message: "Coupon applied — INR 50 off your order"

    CalculateCheckoutRequest:
      type: object
      description: Request body to calculate order totals, optionally with a coupon code
      properties:
        address_id:
          type: string
          format: uuid
          description: UUID of the delivery address to use for this order
        coupon_code:
          type: ["string", "null"]
          description: Optional coupon code to apply; null if no coupon
      required: [address_id]
      example:
        address_id: "9e6b8c2d-1f4a-4e7d-b3c5-0a8f2d6e4b9c"
        coupon_code: "SAVE50"

    CheckoutSummary:
      type: object
      description: Calculated totals for the checkout including GST at 18% on (subtotal - coupon_discount)
      properties:
        items:
          type: array
          description: Cart items included in this calculation
          items:
            $ref: "#/components/schemas/CartItem"
        subtotal:
          type: number
          format: float
          description: Sum of all cart line totals before coupon and tax (INR)
        coupon_code:
          type: ["string", "null"]
          description: Applied coupon code or null
        coupon_discount:
          type: number
          format: float
          description: Discount amount from the coupon in INR (0 if none applied)
        taxable_amount:
          type: number
          format: float
          description: subtotal minus coupon_discount; the base on which GST is calculated
        gst_amount:
          type: number
          format: float
          description: GST component in INR (taxable_amount * 0.18)
        total:
          type: number
          format: float
          description: Final payable amount in INR (taxable_amount + gst_amount)
        address:
          $ref: "#/components/schemas/Address"
      required:
        - items
        - subtotal
        - coupon_discount
        - taxable_amount
        - gst_amount
        - total
        - address
      example:
        items: []
        subtotal: 898.20
        coupon_code: "SAVE50"
        coupon_discount: 50.00
        taxable_amount: 848.20
        gst_amount: 152.68
        total: 1000.88
        address:
          id: "9e6b8c2d-1f4a-4e7d-b3c5-0a8f2d6e4b9c"
          address_line1: "42, Rose Garden Street"
          address_line2: "Flat 3B"
          landmark: "Near City Mall"
          city: "Chennai"
          state: "Tamil Nadu"
          pincode: "600001"
          company_name: null
          gst_number: null
          phone: "+919876543210"
          is_default: true
          created_at: "2026-02-01T12:00:00Z"
          updated_at: "2026-02-01T12:00:00Z"

    PlaceOrderRequest:
      type: object
      description: Request body to place an order from the current cart
      properties:
        address_id:
          type: string
          format: uuid
          description: UUID of the delivery address
        coupon_code:
          type: ["string", "null"]
          description: Optional coupon code to apply; null if no coupon
      required: [address_id]
      example:
        address_id: "9e6b8c2d-1f4a-4e7d-b3c5-0a8f2d6e4b9c"
        coupon_code: "SAVE50"

