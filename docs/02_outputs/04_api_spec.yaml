    # ------------------------------------------------------------------
    # Product
    # ------------------------------------------------------------------

    ProductImage:
      type: object
      description: An image associated with a product
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the product image
        url:
          type: string
          format: uri
          description: Full URL of the image
        alt_text:
          type: ["string", "null"]
          description: Alt text for the image or null
        sort_order:
          type: integer
          description: Display order; lower numbers appear first
      required: [id, url, sort_order]
      example:
        id: "f1e2d3c4-b5a6-7890-1234-56789abcdef0"
        url: "https://cdn.example.com/products/mandala-journal-front.jpg"
        alt_text: "Mandala journal — front cover"
        sort_order: 1

    Product:
      type: object
      description: Full product object with all fields
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the product
        name:
          type: string
          description: Display name of the product
        slug:
          type: string
          description: URL-safe unique identifier
        description:
          type: string
          description: Full product description (may contain HTML)
        price:
          type: number
          format: float
          description: Base price in Indian Rupees (INR)
        discount_percent:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Discount percentage applied to the base price (0 means no discount)
        discounted_price:
          type: number
          format: float
          description: Computed price after applying discount_percent to price
        stock:
          type: integer
          minimum: 0
          description: Available stock quantity
        attributes:
          type: array
          description: Dynamic key-value attributes for the product (e.g. level, theme, size). Managed via /admin/products/{id}/attributes
          items:
            $ref: "#/components/schemas/ProductAttribute"
        images:
          type: array
          description: Ordered list of product images
          items:
            $ref: "#/components/schemas/ProductImage"
        categories:
          type: array
          description: Categories this product belongs to
          items:
            $ref: "#/components/schemas/Category"
        is_active:
          type: boolean
          description: Whether the product is publicly visible
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the product was created
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the product was last updated
      required:
        - id
        - name
        - slug
        - description
        - price
        - discount_percent
        - discounted_price
        - stock
        - attributes
        - images
        - categories
        - is_active
        - created_at
        - updated_at
      example:
        id: "a1b2c3d4-e5f6-7890-ab12-cd34ef567890"
        name: "Mandala Colouring Journal A5"
        slug: "mandala-colouring-journal-a5"
        description: "A beautifully crafted A5 journal with 120 mandala colouring pages."
        price: 499.00
        discount_percent: 10.0
        discounted_price: 449.10
        stock: 150
        attributes:
          - attribute_value_id: "db0e8400-e29b-41d4-a716-446655440021"
            attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
            code: "level"
            attribute_name: "Skill Level"
            value: "Beginner"
            value_slug: "beginner"
            is_filterable: true
          - attribute_value_id: "dc0e8400-e29b-41d4-a716-446655440022"
            attribute_id: "dd0e8400-e29b-41d4-a716-446655440023"
            code: "theme"
            attribute_name: "Theme"
            value: "Mandala"
            value_slug: "mandala"
            is_filterable: true
          - attribute_value_id: "de0e8400-e29b-41d4-a716-446655440024"
            attribute_id: "df0e8400-e29b-41d4-a716-446655440025"
            code: "size"
            attribute_name: "Size"
            value: "A5"
            value_slug: "a5"
            is_filterable: true
        images:
          - id: "f1e2d3c4-b5a6-7890-1234-56789abcdef0"
            url: "https://cdn.example.com/products/mandala-journal-front.jpg"
            alt_text: "Front cover"
            sort_order: 1
        categories:
          - id: "c1a2b3d4-e5f6-7890-ab12-cd34ef567890"
            name: "Journals"
            slug: "journals"
            description: null
            image_url: null
            created_at: "2026-01-01T00:00:00Z"
            updated_at: "2026-01-01T00:00:00Z"
        is_active: true
        created_at: "2026-01-10T09:00:00Z"
        updated_at: "2026-03-01T11:00:00Z"

    ProductSummary:
      type: object
      description: Abbreviated product representation used in list and landing page responses
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the product
        name:
          type: string
          description: Display name of the product
        slug:
          type: string
          description: URL-safe unique identifier
        price:
          type: number
          format: float
          description: Base price in INR
        discount_percent:
          type: number
          format: float
          description: Discount percentage (0 means no discount)
        discounted_price:
          type: number
          format: float
          description: Computed final price after discount
        attributes:
          type: array
          description: Dynamic key-value attributes (e.g. level, theme, size)
          items:
            $ref: "#/components/schemas/ProductAttribute"
        cover_image:
          oneOf:
            - $ref: "#/components/schemas/ProductImage"
