        - $ref: "#/components/parameters/PathAttrDefId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeDefinitionRequest"
      responses:
        "200":
          description: Attribute definition updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinition"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [admin-attributes]
      operationId: adminDeleteAttributeDefinition
      summary: Delete an attribute dimension (admin)
      description: Cascades to all associated PRODUCT_ATTRIBUTE_VALUES and PRODUCT_ATTRIBUTE_ASSIGNMENTS rows.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
      responses:
        "204":
          description: Attribute definition deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/attributes/{attrDefId}/values:
    get:
      tags: [admin-attributes]
      operationId: adminListAttributeValues
      summary: List all allowed values for an attribute dimension (admin)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
      responses:
        "200":
          description: List of attribute values
          content:
            application/json:
              schema:
                type: object
                description: Attribute values list response
                required: [data]
                properties:
                  data:
                    type: array
                    description: Array of attribute values ordered by sort_order
                    items:
                      $ref: "#/components/schemas/AttributeDefinitionValue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [admin-attributes]
      operationId: adminCreateAttributeValue
      summary: Add an allowed value to an attribute dimension (admin)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeDefinitionValueRequest"
      responses:
        "201":
          description: Attribute value created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/admin/attributes/{attrDefId}/values/{valueId}:
    put:
      tags: [admin-attributes]
      operationId: adminUpdateAttributeValue
      summary: Update an allowed value of an attribute dimension (admin)
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
        - $ref: "#/components/parameters/PathAttrValId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeDefinitionValueRequest"
      responses:
        "200":
          description: Attribute value updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionValue"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [admin-attributes]
      operationId: adminDeleteAttributeValue
      summary: Delete an allowed value from an attribute dimension (admin)
      description: Also removes all PRODUCT_ATTRIBUTE_ASSIGNMENTS that reference this value.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
        - $ref: "#/components/parameters/PathAttrValId"
      responses:
        "204":
          description: Attribute value deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /api/v1/auth/login or /api/v1/auth/refresh

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:

    PathId:
      name: id
      in: path
      required: true
      description: UUID identifier of the resource
      schema:
        type: string
        format: uuid
        description: UUID of the resource
      example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

    PathAttrId:
      name: attrId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUID of the product attribute value assignment
      description: Attribute value UUID used as the assignment identifier
      example: "fa0e8400-e29b-41d4-a716-446655440010"

    PathAttrDefId:
      name: attrDefId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUID of the attribute definition (PRODUCT_ATTRIBUTES row)
      description: Attribute definition UUID
      example: "da0e8400-e29b-41d4-a716-446655440020"

    PathAttrValId:
      name: valueId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: UUID of the attribute value (PRODUCT_ATTRIBUTE_VALUES row)
      description: Attribute value UUID
      example: "db0e8400-e29b-41d4-a716-446655440021"

    PathItemId:
      name: itemId
      in: path
      required: true
      description: UUID identifier of the cart item
      schema:
        type: string
        format: uuid
        description: UUID of the cart item
      example: "7b4e2a11-9c83-4f6d-a512-1d8e3b7c0a55"

    QueryPage:
      name: page
      in: query
      required: false
      description: Page number for pagination (1-based)
      schema:
        type: integer
        minimum: 1
        default: 1
        description: Page number, starting from 1
      example: 1

    QueryLimit:
      name: limit
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        description: Items per page; max 100
      example: 20

    QuerySearch:
      name: q
      in: query
      required: false
      description: Full-text search query string
      schema:
        type: string
        description: Search term to filter results
      example: "watercolour journal"

    QueryCategory:
      name: "category[]"
      in: query
      required: false
      description: Filter by one or more category slugs
      schema:
        type: array
        items:
          type: string
          enum:
            - colouring-books
            - drawing-books
            - journals
            - calendars
            - sketch-pads
            - planners
            - stained-art
            - fabrii-art
            - note-book
            - sticker-book
            - sticker-colouring-book
            - activity-cards
          description: Category slug
      style: form
      explode: true
      example: ["journals", "sketch-pads"]

    QueryAttributeValueIds:
      name: "attr_value_id[]"
      in: query
      required: false
      description: |
        Filter products by one or more pre-defined attribute values.
        Each value is the UUID of a PRODUCT_ATTRIBUTE_VALUES row, available as
        AttributeFilterGroup.values[].id in the ProductFilters response.
        Multiple UUIDs for the same attribute dimension are OR-combined;
        UUIDs across different dimensions are AND-combined.
        Example: ?attr_value_id[]=<level-beginner-uuid>&attr_value_id[]=<theme-mandala-uuid>
      schema:
        type: array
        items:
          type: string
          format: uuid
          description: attribute_value_id UUID from PRODUCT_ATTRIBUTE_VALUES
      style: form
      explode: true
      example: ["db0e8400-e29b-41d4-a716-446655440021", "dc0e8400-e29b-41d4-a716-446655440022"]

    QuerySortBy:
      name: sort_by
      in: query
      required: false
      description: Sort order for product listing
      schema:
        type: string
        enum: [price_asc, price_desc, newest, popular]
        default: newest
        description: Sort field and direction
      example: "price_asc"

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------

  responses:

    BadRequest:
      description: Bad request — malformed JSON or invalid query parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 400
            message: "Bad request"
            details: null

    Unauthorized:
      description: Unauthorized — missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 401
            message: "Unauthorized"
            details: null

    Forbidden:
      description: Forbidden — authenticated but insufficient role (requires admin)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 403
            message: "Forbidden"
            details: null

    NotFound:
      description: Not found — resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 404
            message: "Resource not found"
            details: null

    UnprocessableEntity:
      description: Unprocessable entity — validation errors
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          example:
            code: 422
            message: "Validation failed"
            errors:
              - field: "email"
                message: "must be a valid email address"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: 500
            message: "Internal server error"
            details: null

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # ------------------------------------------------------------------
    # Generic / Shared
    # ------------------------------------------------------------------

    PaginationMeta:
      type: object
      description: Metadata for paginated responses
      properties:
        total:
          type: integer
          description: Total number of records matching the query
        page:
          type: integer
          description: Current page number (1-based)
        limit:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages
      required: [total, page, limit, total_pages]
      example:
        total: 87
        page: 1
        limit: 20
        total_pages: 5

    ErrorResponse:
      type: object
      description: Standard error response body
      properties:
        code:
          type: integer
          description: HTTP status code
        message:
          type: string
          description: Human-readable error message
        details:
          type: ["string", "null"]
          description: Optional additional error details or null
      required: [code, message]
      example:
        code: 404
        message: "Resource not found"
        details: null

    ValidationErrorResponse:
      type: object
      description: Validation error response containing field-level errors
      properties:
        code:
          type: integer
          description: HTTP status code (always 422)
        message:
          type: string
          description: Top-level error message
        errors:
          type: array
          description: List of field-level validation errors
          items:
            $ref: "#/components/schemas/FieldError"
      required: [code, message, errors]
      example:
        code: 422
        message: "Validation failed"
        errors:
          - field: "email"
            message: "must be a valid email address"
          - field: "password"
            message: "must be at least 8 characters"

    FieldError:
      type: object
      description: A single field-level validation error
      properties:
        field:
          type: string
          description: The name of the field that failed validation
        message:
          type: string
          description: Description of the validation failure
      required: [field, message]
      example:
        field: "email"
        message: "must be a valid email address"

    MessageResponse:
      type: object
      description: Generic success response with a human-readable message
      properties:
        message:
          type: string
          description: Success or informational message
      required: [message]
      example:
        message: "OTP sent to your email address"

    # ------------------------------------------------------------------
    # Auth
    # ------------------------------------------------------------------

    RegisterInitRequest:
      type: object
      description: Request body to initiate registration by sending an OTP to the given email
      properties:
        email:
          type: string
          format: email
          description: Email address to send the OTP to
      required: [email]
      example:
        email: "alice@example.com"

    VerifyOTPRequest:
      type: object
      description: Request body to verify the OTP that was sent to the email
      properties:
        email:
          type: string
          format: email
          description: Email address the OTP was sent to
        otp:
          type: string
          description: 6-digit OTP code received by email
      required: [email, otp]
      example:
        email: "alice@example.com"
        otp: "482910"

    OTPTokenResponse:
      type: object
      description: Short-lived token returned after successful OTP verification; used to complete registration
      properties:
        otp_token:
          type: string
          description: Short-lived JWT used only for the register/complete step
        expires_in:
          type: integer
          description: Number of seconds until the otp_token expires
      required: [otp_token, expires_in]
      example:
        otp_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.otp.sig"
        expires_in: 600

    RegisterCompleteRequest:
      type: object
      description: Request body to complete registration — set name and password using the otp_token
      properties:
        otp_token:
          type: string
          description: Short-lived token obtained from the verify-otp step
        first_name:
          type: string
          description: Customer's first name
        last_name:
          type: string
          description: Customer's last name
        password:
          type: string
          format: password
          minLength: 8
          description: Desired password; minimum 8 characters
      required: [otp_token, first_name, last_name, password]
      example:
        otp_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.otp.sig"
        first_name: "Alice"
        last_name: "Smith"
        password: "Secure@1234"

    PasswordResetRequestRequest:
      type: object
      description: Request body to initiate a password reset by sending an OTP to the given email
      required: [email]
      properties:
        email:
          type: string
          format: email
          description: Email address of the account to reset
          example: "alice@example.com"
      example:
        email: "alice@example.com"

    PasswordResetCompleteRequest:
      type: object
      description: |
        Request body to complete a password reset using the otp_token obtained from
        the password-reset/verify-otp step. The token is single-use and expires in 10 minutes.
      required: [otp_token, new_password, confirm_new_password]
      properties:
        otp_token:
          type: string
          description: Short-lived token obtained from the password-reset/verify-otp step
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.otp.sig"
        new_password:
          type: string
          format: password
          minLength: 8
          description: The desired new password; minimum 8 characters
          example: "NewSecure@5678"
        confirm_new_password:
          type: string
          format: password
          description: Must match new_password
          example: "NewSecure@5678"
      example:
        otp_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.otp.sig"
        new_password: "NewSecure@5678"
        confirm_new_password: "NewSecure@5678"

    LoginRequest:
      type: object
      description: Email and password credentials for login
      properties:
        email:
          type: string
          format: email
          description: Registered email address
        password:
          type: string
          format: password
          description: Account password
      required: [email, password]
      example:
        email: "alice@example.com"
        password: "Secure@1234"

    FacebookLoginRequest:
      type: object
      description: Facebook OAuth access token for social login
      properties:
        access_token:
          type: string
          description: Facebook OAuth access token obtained from the Facebook SDK
      required: [access_token]
      example:
        access_token: "EAABwzLixnjYBAFb..."

    AuthTokenResponse:
      type: object
      description: JWT access and refresh token pair returned after successful authentication
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token (Bearer)
        refresh_token:
          type: string
          description: Long-lived refresh token used to obtain a new access token
        token_type:
          type: string
          description: Token type; always "bearer"
        expires_in:
          type: integer
          description: Number of seconds until the access_token expires
        user:
          $ref: "#/components/schemas/UserProfile"
      required: [access_token, refresh_token, token_type, expires_in, user]
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.sig"
        refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.sig"
        token_type: "bearer"
        expires_in: 900
        user:
          id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
          email: "alice@example.com"
          first_name: "Alice"
          last_name: "Smith"
          role: "customer"
          created_at: "2026-01-15T10:30:00Z"
          updated_at: "2026-01-15T10:30:00Z"

    RefreshTokenRequest:
      type: object
      description: Refresh token to obtain a new access token or to logout
      properties:
        refresh_token:
          type: string
          description: Valid refresh token previously issued by the server
      required: [refresh_token]
      example:
        refresh_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh.sig"

    # ------------------------------------------------------------------
    # User / Account
    # ------------------------------------------------------------------

    UserProfile:
      type: object
      description: Customer or admin user profile
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the user
        email:
          type: string
          format: email
          description: User's email address
        first_name:
          type: string
          description: User's first name
        last_name:
          type: string
          description: User's last name
        role:
          type: string
          enum: [customer, admin]
          description: Role assigned to the user
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the account was created
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the account was last updated
      required: [id, email, first_name, last_name, role, created_at, updated_at]
      example:
        id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
        email: "alice@example.com"
        first_name: "Alice"
        last_name: "Smith"
        role: "customer"
        created_at: "2026-01-15T10:30:00Z"
        updated_at: "2026-03-01T08:00:00Z"

    UpdateProfileRequest:
      type: object
      description: Request body to update the customer's display name
      properties:
        first_name:
          type: string
          description: Updated first name
        last_name:
          type: string
          description: Updated last name
      required: [first_name, last_name]
      example:
        first_name: "Alice"
        last_name: "Johnson"

    ChangePasswordRequest:
      type: object
      description: Request body to change the account password
      properties:
        current_password:
          type: string
          format: password
          description: The user's current password for verification
        new_password:
          type: string
          format: password
          minLength: 8
          description: The desired new password; minimum 8 characters
        confirm_new_password:
          type: string
          format: password
          description: Must match new_password
      required: [current_password, new_password, confirm_new_password]
      example:
        current_password: "Secure@1234"
        new_password: "NewSecure@5678"
        confirm_new_password: "NewSecure@5678"

    RequestEmailChangeRequest:
      type: object
      description: Request body to initiate an email address change; sends an OTP to the new email
      properties:
        new_email:
          type: string
          format: email
          description: The new email address to change to
      required: [new_email]
      example:
        new_email: "alice.new@example.com"

    ConfirmEmailChangeRequest:
      type: object
      description: Request body to confirm the email change by verifying the OTP sent to the new email
      properties:
        new_email:
          type: string
          format: email
          description: The new email address the OTP was sent to
        otp:
          type: string
          description: 6-digit OTP received at the new email address
      required: [new_email, otp]
      example:
        new_email: "alice.new@example.com"
        otp: "719283"

    # ------------------------------------------------------------------
    # Address
    # ------------------------------------------------------------------

    Address:
      type: object
      description: A saved delivery or billing address belonging to a customer
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the address
        address_line1:
          type: string
          description: Primary address line (street, building number)
        address_line2:
          type: ["string", "null"]
          description: Secondary address line (apartment, floor) or null
        landmark:
          type: ["string", "null"]
          description: Nearby landmark or null
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province name
        pincode:
          type: string
          description: Postal / PIN code
        company_name:
          type: ["string", "null"]
          description: Company name for GST billing or null
        gst_number:
          type: ["string", "null"]
          description: GST registration number or null
        phone:
          type: string
          description: Contact phone number for this address
        is_default:
          type: boolean
          description: Whether this is the customer's default shipping address
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the address was created
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the address was last updated
      required:
        - id
        - address_line1
        - city
        - state
        - pincode
        - phone
        - is_default
        - created_at
        - updated_at
      example:
        id: "9e6b8c2d-1f4a-4e7d-b3c5-0a8f2d6e4b9c"
        address_line1: "42, Rose Garden Street"
        address_line2: "Flat 3B"
        landmark: "Near City Mall"
        city: "Chennai"
        state: "Tamil Nadu"
        pincode: "600001"
        company_name: null
        gst_number: null
        phone: "+919876543210"
        is_default: true
        created_at: "2026-02-01T12:00:00Z"
        updated_at: "2026-02-01T12:00:00Z"

    CreateAddressRequest:
      type: object
      description: Request body to create a new address
      properties:
        address_line1:
          type: string
          description: Primary address line
        address_line2:
          type: ["string", "null"]
          description: Secondary address line or null
        landmark:
          type: ["string", "null"]
          description: Nearby landmark or null
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province name
        pincode:
          type: string
          description: Postal / PIN code
        company_name:
          type: ["string", "null"]
          description: Company name for GST billing or null
        gst_number:
          type: ["string", "null"]
          description: GST registration number or null
        phone:
          type: string
          description: Contact phone number for this address
        is_default:
          type: boolean
          description: Set as the default shipping address
      required: [address_line1, city, state, pincode, phone, is_default]
      example:
        address_line1: "42, Rose Garden Street"
        address_line2: "Flat 3B"
        landmark: "Near City Mall"
        city: "Chennai"
        state: "Tamil Nadu"
        pincode: "600001"
        company_name: null
        gst_number: null
        phone: "+919876543210"
        is_default: true

    UpdateAddressRequest:
      type: object
      description: Request body to update an address; all fields are optional
      properties:
        address_line1:
          type: string
          description: Primary address line
        address_line2:
          type: ["string", "null"]
          description: Secondary address line or null
        landmark:
          type: ["string", "null"]
          description: Nearby landmark or null
        city:
          type: string
          description: City name
        state:
          type: string
          description: State or province name
        pincode:
          type: string
          description: Postal / PIN code
        company_name:
          type: ["string", "null"]
          description: Company name for GST billing or null
        gst_number:
          type: ["string", "null"]
          description: GST registration number or null
        phone:
          type: string
          description: Contact phone number for this address
        is_default:
          type: boolean
          description: Set as the default shipping address
      example:
        city: "Bengaluru"
        state: "Karnataka"
        pincode: "560001"
        is_default: false

    # ------------------------------------------------------------------
