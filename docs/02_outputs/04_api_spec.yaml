  # ---------------------------------------------------------------------------
  # Admin Image Upload
  # ---------------------------------------------------------------------------

  /api/v1/admin/upload/image/presign:
    post:
      tags: [admin-upload]
      operationId: adminPresignImageUpload
      summary: Request a presigned S3 URL to upload a product image (admin)
      description: |
        Returns a short-lived presigned S3 PUT URL and the final public CDN URL
        the image will be accessible at once uploaded.

        **Upload flow:**
        1. Call this endpoint to get `presigned_url` and `public_url`.
        2. PUT the image file directly to `presigned_url` from the client
           (Content-Type must match the `content_type` sent in step 1).
        3. Pass `public_url` in the `image_urls[].url` field when creating or
           updating a product.

        The presigned URL expires after 5 minutes. Re-request if it expires
        before the upload completes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImagePresignRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImagePresignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

