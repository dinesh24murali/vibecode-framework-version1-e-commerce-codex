openapi: "3.1.0"
info:
  title: e-commerce-site API
  description: REST API for e-commerce-site — a book-selling platform. Backend is Go 1.26 / Gin with Postgres.
  version: "1.0.0"
  contact:
    name: Feather Tech
servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://staging-api.example.com
    description: Staging
  - url: https://api.example.com
    description: Production

tags:
  - name: auth
    description: Customer authentication and token management
  - name: landing
    description: Public landing page data
  - name: products
    description: Public product catalog
  - name: categories
    description: Public category listing
  - name: cart
    description: Customer shopping cart (protected)
  - name: checkout
    description: Checkout flow — calculate, coupon, place order (protected)
  - name: orders
    description: Customer order history and management (protected)
  - name: account
    description: Customer profile and address management (protected)
  - name: contact
    description: Public contact / enquiry form
  - name: admin-auth
    description: Admin authentication
  - name: admin-products
    description: Admin product management (admin role)
  - name: admin-categories
    description: Admin category management (admin role)
  - name: admin-orders
    description: Admin order management (admin role)
  - name: attributes
    description: Public attribute filter options (level, size, theme, etc.)
  - name: admin-attributes
    description: Admin attribute definition and value management (admin role)

security: []

paths:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /api/v1/auth/register/init:
    post:
      tags: [auth]
      operationId: registerInit
      summary: Send OTP to email to begin registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInitRequest"
      responses:
        "200":
          description: OTP sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/register/verify-otp:
    post:
      tags: [auth]
      operationId: registerVerifyOTP
      summary: Verify OTP and receive a short-lived otp_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
      responses:
        "200":
          description: OTP verified; otp_token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/register/complete:
    post:
      tags: [auth]
      operationId: registerComplete
      summary: Complete registration — set first_name, last_name, password using otp_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCompleteRequest"
      responses:
        "201":
          description: Account created; auth tokens returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Email and password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login/facebook:
    post:
      tags: [auth]
      operationId: loginFacebook
      summary: Facebook OAuth login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacebookLoginRequest"
      responses:
        "200":
          description: Facebook login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshToken
      summary: Refresh access token using a valid refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: New token pair returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Invalidate the current refresh token (protected)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Password Reset (Forgot Password)
  # ---------------------------------------------------------------------------

  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: passwordResetRequest
      summary: Send a password-reset OTP to the given email
      description: |
        Sends a one-time passcode to the email if a matching account exists.
        Always returns 200 regardless of whether the email is registered to
        prevent account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestRequest"
      responses:
        "200":
          description: OTP sent (or silently skipped if email not found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "If an account exists for this email, an OTP has been sent."
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/password-reset/verify-otp:
    post:
      tags: [auth]
      operationId: passwordResetVerifyOTP
      summary: Verify the password-reset OTP and receive a short-lived otp_token
      description: |
        Accepts the email and OTP issued by the password-reset/request step.
        Returns a short-lived `otp_token` that must be supplied to the
        password-reset/complete step. The token expires in 10 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOTPRequest"
      responses:
        "200":
          description: OTP verified; otp_token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTPTokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/password-reset/complete:
    post:
      tags: [auth]
      operationId: passwordResetComplete
      summary: Set a new password using the otp_token from the verify-otp step
      description: |
        Accepts the short-lived `otp_token` obtained from password-reset/verify-otp
        and the desired new password. The token is single-use and expires in 10 minutes.
        On success the user's password is updated and all existing refresh tokens for
        the account are revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetCompleteRequest"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              example:
                message: "Your password has been reset. Please log in with your new password."
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Landing
  # ---------------------------------------------------------------------------

  /api/v1/landing:
    get:
      tags: [landing]
      operationId: getLandingPage
      summary: Returns carousel slides and featured products (public)
      responses:
        "200":
          description: Landing page data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LandingPageResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Products
  # ---------------------------------------------------------------------------

  /api/v1/products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Paginated, filterable public product catalog
      parameters:
        - $ref: "#/components/parameters/QuerySearch"
        - $ref: "#/components/parameters/QueryCategory"
        - $ref: "#/components/parameters/QueryAttributeValueIds"
        - $ref: "#/components/parameters/QuerySortBy"
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
      responses:
        "200":
          description: Paginated product list with filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/products/{id}:
    get:
      tags: [products]
      operationId: getProduct
      summary: Single product detail (public)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------

  /api/v1/categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: List all categories (public)
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    description: Array of category objects
                    items:
                      $ref: "#/components/schemas/Category"
                required: [data]
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/categories/{id}:
    get:
      tags: [categories]
      operationId: getCategory
      summary: Single category (public)
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Category detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Attributes (public filter options)
  # ---------------------------------------------------------------------------

  /api/v1/attributes:
    get:
      tags: [attributes]
      operationId: listFilterableAttributes
      summary: List all filterable attribute definitions with their values (public)
      description: |
        Returns every attribute dimension that has `is_filterable: true`, each with its
        complete list of allowed values. Intended for pre-populating filter UI (level,
        size, theme, etc.) before the user applies any product filters.
      responses:
        "200":
          description: List of filterable attributes with their values
          content:
            application/json:
              schema:
                type: object
                description: Filterable attributes response
                required: [data]
                properties:
                  data:
                    type: array
                    description: Filterable attribute definitions, each including their full value list, ordered by sort_order
                    items:
                      $ref: "#/components/schemas/AttributeWithValues"
              example:
                data:
                  - id: "da0e8400-e29b-41d4-a716-446655440020"
                    code: "level"
                    name: "Skill Level"
                    is_filterable: true
                    sort_order: 1
                    values:
                      - id: "db0e8400-e29b-41d4-a716-446655440021"
                        attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
                        value: "Beginner"
                        value_slug: "beginner"
                        sort_order: 1
                      - id: "dc0e8400-e29b-41d4-a716-446655440022"
                        attribute_id: "da0e8400-e29b-41d4-a716-446655440020"
                        value: "Intermediate"
                        value_slug: "intermediate"
                        sort_order: 2
                  - id: "dd0e8400-e29b-41d4-a716-446655440023"
                    code: "theme"
                    name: "Theme"
                    is_filterable: true
                    sort_order: 2
                    values:
                      - id: "de0e8400-e29b-41d4-a716-446655440024"
                        attribute_id: "dd0e8400-e29b-41d4-a716-446655440023"
                        value: "Mandala"
                        value_slug: "mandala"
                        sort_order: 1
                  - id: "df0e8400-e29b-41d4-a716-446655440025"
                    code: "size"
                    name: "Size"
                    is_filterable: true
                    sort_order: 3
                    values:
                      - id: "e00e8400-e29b-41d4-a716-446655440026"
                        attribute_id: "df0e8400-e29b-41d4-a716-446655440025"
                        value: "A5"
                        value_slug: "a5"
                        sort_order: 1
                      - id: "e10e8400-e29b-41d4-a716-446655440027"
                        attribute_id: "df0e8400-e29b-41d4-a716-446655440025"
                        value: "A4"
                        value_slug: "a4"
                        sort_order: 2
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/attributes/{attrDefId}/values:
    get:
      tags: [attributes]
      operationId: listAttributeValues
      summary: List all allowed values for a single filterable attribute (public)
      description: |
        Returns the complete list of allowed values for the given attribute dimension,
        ordered by `sort_order`. Useful when the frontend needs to lazy-load values
        for a specific filter dimension (e.g. all possible themes).
      parameters:
        - $ref: "#/components/parameters/PathAttrDefId"
      responses:
        "200":
          description: Allowed values for the attribute dimension
          content:
            application/json:
              schema:
                type: object
                description: Attribute values list response
                required: [data]
                properties:
                  data:
                    type: array
                    description: Allowed values ordered by sort_order
                    items:
                      $ref: "#/components/schemas/AttributeDefinitionValue"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Cart
  # ---------------------------------------------------------------------------

  /api/v1/cart:
    get:
      tags: [cart]
      operationId: getCart
      summary: Get the current customer's cart
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cart contents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [cart]
      operationId: clearCart
      summary: Clear all items from the cart
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cart cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/cart/items:
    post:
      tags: [cart]
      operationId: addCartItem
      summary: Add a product to the cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddToCartRequest"
      responses:
        "201":
          description: Item added to cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/cart/items/{itemId}:
    put:
      tags: [cart]
      operationId: updateCartItem
      summary: Update quantity of a cart item
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Cart item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [cart]
      operationId: removeCartItem
      summary: Remove a specific item from the cart
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathItemId"
      responses:
        "200":
          description: Item removed from cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Checkout
  # ---------------------------------------------------------------------------

  /api/v1/checkout/calculate:
    post:
      tags: [checkout]
      operationId: calculateCheckout
      summary: Calculate totals with optional coupon code; returns CheckoutSummary
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateCheckoutRequest"
      responses:
        "200":
          description: Checkout summary with totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/checkout/coupons/validate:
    post:
      tags: [checkout]
      operationId: validateCoupon
      summary: Validate a coupon code without placing an order
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyCouponRequest"
      responses:
        "200":
          description: Coupon validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CouponValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/checkout/orders:
    post:
      tags: [checkout]
      operationId: placeOrder
      summary: Place an order from the current cart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderRequest"
      responses:
        "201":
          description: Order placed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------

  /api/v1/orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Paginated order history for the current customer
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/QueryPage"
        - $ref: "#/components/parameters/QueryLimit"
        - name: status
          in: query
          required: false
          description: Filter orders by status
          schema:
            type: string
            enum: [open, fulfilled, cancelled]
            description: Order status filter
      responses:
        "200":
          description: Paginated list of orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{id}:
    get:
      tags: [orders]
      operationId: getOrder
      summary: Get a single order by ID
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Order detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{id}/cancel:
    put:
      tags: [orders]
      operationId: cancelOrder
      summary: Cancel an open order
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PathId"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ---------------------------------------------------------------------------
  # Account — Profile
  # ---------------------------------------------------------------------------

  /api/v1/account/profile:
    get:
      tags: [account]
      operationId: getProfile
      summary: Get the current customer's profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [account]
      operationId: updateProfile
      summary: Update first_name and last_name
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
